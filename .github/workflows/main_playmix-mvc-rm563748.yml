name: 'Build and deploy JAR app to Azure Web App: playmix-mvc-rm563748'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Java version
        uses: actions/setup-java@v1
        with:
          java-version: '17'

      - name: Build with Maven
        env:
          SPRING_DATASOURCE_USERNAME: ${{ secrets.ORACLE_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.ORACLE_URL }}
        run: mvn clean install

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'playmix-mvc-rm563748'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_3b3c2e32716a40fb837a44fc1bf85b3c }}
          package: '${{ github.workspace }}/target/*.jar'
